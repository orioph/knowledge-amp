let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);scenes.forEach(s=>s.layout&&s.layout());if(typeof Dand!=='undefined')Dand.layout();}
const TAU=Math.PI*2, rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let seed=7;function srnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
function gauss(){return Math.sqrt(-2*Math.log(srnd()+1e-9))*Math.cos(TAU*srnd());}
let FIG=true; // figurative wing visible
let fog=0, fogX=0, fogY=0; // breath on the mirror
const GATHERED='2026-11-19';

/* ---------- store (per viewer, best effort) ---------- */
const store={get(k,d){try{const v=localStorage.getItem('macroscope.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('macroscope.'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- facts: news gathered at build time ---------- */
const N=(d,t,src,url,credit)=>({d,t,src,url,credit});
const PLANETS=[

];

  news:[N('12 Aug 2026','A solar eclipse crossed the sky on 12 August 2026.','Astronomy Now','https://astronomynow.com/tag/europa-clipper/','eclipse watchers everywhere')]};
const LEVELINFO={

   body:'Each seed is a world. Breathe and they go out to explore, then fall back into one dot (it looks like sleep, and it is not), then grow again along new paths. The seeds sit on the golden angle, the sunflower rule (phyllotaxis). Your own threads ride some of the seeds.'},

   body:'The one bubble. The froth in its corner is the physical part. They reflect and feed each other: the dot, the inside of the sphere and its outside, mirrored without interval.'},

   body:'Galaxies gather along filaments and walls around vast voids. The pink flashes are the figurative wing: “instantaneous star networks”, an elusiphore, not a measurement.'},
 galaxy:{name:'Milky Way',sub:'hundreds of billions of stars · the Sun ~26,000 light-years out',fact:.96,fig:.35,
   body:'Our galaxy, drawn as a barred spiral. The green twinkles are the figurative wing: “trillions of living worlds” is a hope and a wonder, not yet a count. Click the Sun to go home.'}
};

/* ---------- foam bubble drawing (thin-film shimmer) ---------- */
function bubble(x,y,r,t,a=1,hueOff=0){
  if(r<0.5)return;
  ctx.save();ctx.globalAlpha=a;
  const g=ctx.createRadialGradient(x-r*.3,y-r*.35,r*.1,x,y,r);
  g.addColorStop(0,'rgba(255,255,255,0.05)');g.addColorStop(.75,'rgba(150,130,255,0.04)');g.addColorStop(1,'rgba(200,180,255,0.16)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  const n=r>60?7:3;
  for(let i=0;i<n;i++){
    const h=(hueOff+t*18+i*47+(x+y)*.2)%360;
    ctx.strokeStyle=`hsla(${h},90%,72%,${(r>60?.22:.5)/(1+i*.6)})`;
    ctx.lineWidth=Math.max(.6,r*(r>60?.012:.05));
    ctx.beginPath();ctx.arc(x,y,r*(1-i*(r>60?.006:.05)),0,TAU);ctx.stroke();
  }
  const ha=r>60?.06:r>20?.16:.5;ctx.fillStyle=`rgba(255,255,255,${ha})`;ctx.beginPath();
  ctx.ellipse(x-r*.5,y-r*.55,r*(r>20?.11:.18),r*(r>20?.045:.08),-.7,0,TAU);ctx.fill();
  ctx.restore();
}
function addFog(x,y){fog=1;fogX=x;fogY=y;}
function drawFog(){
  if(fog<=0.01)return;
  const R=Math.hypot(W,H)*(1.15-fog);
  const g=ctx.createRadialGradient(fogX,fogY,0,fogX,fogY,R);
  g.addColorStop(0,`rgba(235,230,255,${.22*fog})`);g.addColorStop(.6,`rgba(200,190,255,${.10*fog})`);g.addColorStop(1,'rgba(200,190,255,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

/* ---------- scenes ---------- */
const scenes=[];
const Meta={key:'meta',label:'meta',foam:[],stars:[],
 layout(){this.cx=W*.47;this.cy=H*.46;this.R=Math.min(W,H)*.38;
   const fx=this.cx+this.R*.42,fy=this.cy+this.R*.47;this.fx=fx;this.fy=fy;
   seed=11;this.foam=[];
   for(let i=0;i<42;i++){const a=srnd()*TAU,d=Math.sqrt(srnd())*this.R*.17;this.foam.push({x:fx+Math.cos(a)*d,y:fy+Math.sin(a)*d,r:2+Math.pow(srnd(),2)*this.R*.045,ph:srnd()*TAU});}
   for(let k=0;k<60;k++)for(let i=0;i<this.foam.length;i++)for(let j=i+1;j<this.foam.length;j++){const A=this.foam[i],B=this.foam[j];const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1,m=A.r+B.r+1;if(d<m){const p=(m-d)/2/d;A.x-=dx*p;A.y-=dy*p;B.x+=dx*p;B.y+=dy*p;}}
   const kc=store.get('keys',{});Object.keys(kc).slice(-30).forEach(k=>this.addBubble(k,true));this.relax(60);
   this.stars=[];for(let i=0;i<220;i++)this.stars.push({x:srnd()*W,y:srnd()*H,a:srnd()*.6,s:srnd()*1.2});
   this.dust=[];for(let i=0;i<180;i++){const a=srnd()*TAU,d=Math.sqrt(srnd())*this.R*.92;this.dust.push({a,d,s:.2+srnd()*.8,h:200+srnd()*120});}
 },
 addBubble(k,quiet){if(this.foam.some(b=>b.k===k))return;const a=Math.random()*TAU,d=this.R*.2;this.foam.push({x:this.fx+Math.cos(a)*d,y:this.fy+Math.sin(a)*d,r:4+Math.random()*5,ph:Math.random()*TAU,k,born:quiet?0:1});if(!quiet)this.relax(40);},
 relax(n){const F=this.foam;for(let k=0;k<n;k++)for(let i=0;i<F.length;i++){const A=F[i];A.x+=(this.fx-A.x)*.004;A.y+=(this.fy-A.y)*.004;for(let j=i+1;j<F.length;j++){const B=F[j];const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1,m=A.r+B.r+1;if(d<m){const p=(m-d)/2/d;A.x-=dx*p;A.y-=dy*p;B.x+=dx*p;B.y+=dy*p;}}}},
 draw(t,dt){
   if(FORM==='dandelion')return Dand.draw(t,dt);
   for(const s of this.stars){ctx.fillStyle=`rgba(220,210,255,${s.a*(.6+.4*Math.sin(t*.7+s.x))})`;ctx.fillRect(s.x,s.y,s.s,s.s);}
   const {cx,cy,R}=this;
   for(const p of this.dust){const a=p.a+t*.012*p.s;const x=cx+Math.cos(a)*p.d,y=cy+Math.sin(a)*p.d*.92;ctx.fillStyle=`hsla(${p.h+t*4},70%,75%,.18)`;ctx.fillRect(x,y,1.3,1.3);}
   bubble(cx,cy,R,t,1);
   // the outside reflects the inside: mirrored ghost of the foam across the centre
   for(const b of this.foam){const mx=2*cx-b.x,my=2*cy-b.y;ctx.strokeStyle=`hsla(${(t*20+b.ph*50)%360},80%,80%,.10)`;ctx.lineWidth=.7;ctx.beginPath();ctx.arc(mx,my,b.r*1.6,0,TAU);ctx.stroke();}
   // threads: the physical bubbles feed each other
   const F=this.foam;
   for(let i=0;i<F.length;i++)for(let j=i+1;j<F.length;j++){const A=F[i],B=F[j],d=Math.hypot(A.x-B.x,A.y-B.y);if(d<A.r+B.r+18){const p=.5+.5*Math.sin(t*2.2+A.ph+B.ph);ctx.strokeStyle=`rgba(170,240,225,${.08+.25*p})`;ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();}}
   // thread from foam to the whole: feeding the meta bubble
   ctx.strokeStyle=`rgba(200,180,255,${.12+.08*Math.sin(t)})`;ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(this.fx,this.fy);ctx.quadraticCurveTo(cx+R*.1,cy+R*.1,cx-R*.2,cy-R*.25);ctx.stroke();
   for(const b of F){const wob=Math.sin(t*1.3+b.ph)*.6;bubble(b.x+wob,b.y-wob,b.r,t,1,b.ph*60);
     // each small bubble holds a tiny image of the big one
     if(b.r>4){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=.5;ctx.beginPath();ctx.arc(b.x+b.r*.25,b.y+b.r*.2,b.r*.28,0,TAU);ctx.stroke();ctx.fillStyle='rgba(180,255,235,.8)';ctx.fillRect(b.x+b.r*.38,b.y+b.r*.33,1.2,1.2);}
     if(fog>.05){ctx.fillStyle=`rgba(255,255,255,${.35*fog})`;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();}
     if(b.born>0){ctx.strokeStyle=`rgba(255,255,255,${b.born})`;ctx.beginPath();ctx.arc(b.x,b.y,b.r+12*(1-b.born),0,TAU);ctx.stroke();b.born=Math.max(0,b.born-.01);}}
   const lab=F.filter(b=>b.k).slice(-8);ctx.font='10px system-ui,sans-serif';ctx.fillStyle='rgba(180,255,235,.75)';for(const b of lab)ctx.fillText(b.k,b.x+b.r+2,b.y+3);
   if(fog>.05){ctx.strokeStyle=`rgba(255,255,255,${.5*fog})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.stroke();}
   if(this.hoverFoam){ctx.strokeStyle='rgba(180,255,235,.6)';ctx.setLineDash([3,4]);ctx.beginPath();ctx.arc(this.fx,this.fy,this.R*.22,0,TAU);ctx.stroke();ctx.setLineDash([]);}
 },
 hit(x,y){if(Math.hypot(x-this.fx,y-this.fy)<this.R*.25)return 'foam';if(Math.hypot(x-this.cx,y-this.cy)<this.R)return 'meta';return null;},
 hover(x,y){if(FORM==='dandelion')return Dand.hover(x,y);const h=this.hit(x,y);this.hoverFoam=h==='foam';return h==='foam'?'the physical part · click to travel in':h==='meta'?'the meta bubble · everything · click to read it':''},
 click(x,y){if(FORM==='dandelion')return Dand.click(x,y);const h=this.hit(x,y);if(h==='foam')go('web',x,y);else if(h==='meta')showInfo('meta');}
};
let FORM='foam', LENS=false, mx=-1, my=-1, lastMove=-99;

  tc.font='15px ui-monospace,Menlo,monospace';tc.fillText('route  '+path,40,158);
  tc.fillText('when   '+new Date().toISOString().replace('T',' ').slice(0,19)+' UTC',40,184);
  tc.fillText(`wings  factual ${lastPlace.f.toFixed(2)} · figurative ${lastPlace.g.toFixed(2)}`,40,210);
  tc.fillText('cycle  bubble → stick → glyph → echo → mirror → one',40,236);
  tc.fillStyle='#b3261e';tc.font='600 26px ui-monospace,Menlo,monospace';tc.fillText('Nº '+String(Math.floor(Math.random()*1e8)).padStart(8,'0'),40,300);
  tc.save();tc.translate(520,330);tc.rotate(-.18);tc.strokeStyle='rgba(120,40,140,.7)';tc.lineWidth=3;tc.beginPath();tc.arc(0,0,58,0,TAU);tc.stroke();tc.beginPath();tc.arc(0,0,46,0,TAU);tc.stroke();
  tc.fillStyle='rgba(120,40,140,.75)';tc.font='600 11px ui-monospace,Menlo,monospace';tc.textAlign='center';tc.fillText('VALIDATED BY',0,-8);tc.fillText('LUMINOCT { OPUS }',0,8);tc.fillText('circa 1954',0,24);tc.restore();
  tc.fillStyle='#2a2018';tc.font='12px ui-monospace,Menlo,monospace';tc.fillText('paid in thanks · credit is the first currency',40,380);
  tc.restore();
  document.getElementById('tkimg').src=tk.toDataURL('image/png');document.getElementById('ticketbox').style.display='flex';addFog(W/2,H/2);
}
document.getElementById('tkclose').onclick=()=>document.getElementById('ticketbox').style.display='none';

/* ---------- sentence bubble ---------- */
const STOP=new Set('a an the and or but if of to in on at by for with from as is are was were be been am i you we they he she it this that these those my your our their me us them do does did not no so too very just what who where when why how can will would should could there here about into over under than then also'.split(' '));
const HOLO='place thing method being light hand face flower person sun tree mother world space foot sky father mind moon eye animal dream food time love play star song word friend separation number idea reflection category birth life point line circle soul organism plant bird fish'.split(' ');
const VERBS='touch hear know feel hold see learn find'.split(' ');
const an=w=>(/^[aeiou]/.test(w)?'an ':'a ')+w;
const POINTERS={mercury:'solar',venus:'solar',earth:'solar',moon:'solar',mars:'solar',jupiter:'solar',saturn:'solar',uranus:'solar',neptune:'solar',sun:'solar',planet:'solar',planets:'solar',galaxy:'galaxy',milky:'galaxy',stars:'galaxy',star:'galaxy',web:'web',cosmos:'web',universe:'web',galaxies:'web',everything:'meta',creation:'meta',bubble:'meta',one:'meta'};
const pick=a=>a[(Math.random()*a.length)|0];
const AX={past:'#f2b45a',future:'#8fa8ff',threat:'#ff8a7a',benefit:'#79e0c4',mirror:'#e59ad0'};
let foamS=[], phase=null;
function words(s){return (s.toLowerCase().match(/[a-z’']+/g)||[]).map(w=>w.replace(/[’']/g,''));}
function keyOf(ws){const c=ws.filter(w=>!STOP.has(w)&&w.length>2);return c.sort((a,b)=>b.length-a.length)[0]||ws[0]||'this';}
function variants(s,k){const h=pick(HOLO),h2=pick(HOLO.filter(x=>x!==h)),v=pick(VERBS);const ws=s.trim().split(/\s+/);
  return [
   ['past',`long before this, ${k} was already ${h}`],
   ['future',`soon, ${k} will ${v} the ${h2}`],
   ['threat',`unless ${k} is held gently, it breaks`],
   ['benefit',`because of ${k}, someone is fed`],
   ['mirror',ws.slice().reverse().join(' ')],
   ['future',`what is ${k} looking at, when it looks at you?`],
   ['benefit',`every ${k} is ${an(h)}; every ${h} is a mirror; so every ${k} is a mirror`],
   ['past',`${k} : ${h} | you : ?`],
   ['threat',`what if ${k} were never said?`]
  ];}
function reply(s,k){
  const hist=store.get('hist',[]);const ws=new Set(words(s).filter(w=>!STOP.has(w)&&w.length>2));
  let link=null;for(let i=hist.length-1;i>=0;i--){const shared=words(hist[i]).filter(w=>ws.has(w));if(shared.length&&hist[i]!==s){link={old:hist[i],w:shared[0]};break;}}
  hist.push(s);store.set('hist',hist.slice(-60));
  const kc=store.get('keys',{});kc[k]=(kc[k]||0)+1;store.set('keys',kc);
  if(link)return `earlier: “${link.old.slice(0,48)}”. both touch “${link.w}”. so they meet there, and so do you`;
  const h=pick(HOLO);
  return pick([`all seeing is a bubble collapsing; “${k}” is a seeing; so “${k}” is a bubble collapsing`,
               `as ${k} is to ${h}, your sentence is to the one who reads it`,
               `${k} went out, became one stroke, and came back as you`]);
}
function bloom(s){
  const k=keyOf(words(s));const ox=W/2,oy=H-80;
  foamS=variants(s,k).map(([ax,tx],i)=>{const a=-Math.PI*(.12+.76*(i/8))+rnd(-.05,.05);const d=Math.min(W,H)*rnd(.26,.42);
    return {ax,tx,x:ox,y:oy,tx0:ox+Math.cos(a)*d*1.35,ty0:oy+Math.sin(a)*d*1.3,r:rnd(50,68),ph:rnd(0,TAU)};});
  const isNew=!(k in store.get('keys',{}));
  phase={s,k,t:0,ox,oy,glyph:s,reply:reply(s,k)};
  if(isNew&&Meta.foam.length){Meta.addBubble(k);phase.grew=k;}
  if(FORM==='dandelion'&&cur==='meta')setTimeout(()=>Dand.blow(W/2,H),4800);
  const dest=words(s).map(w=>POINTERS[w]).find(Boolean);
  phase.dest=dest;
  threads();
}
function drawSentence(dt,t){
  if(!phase)return;phase.t+=dt;const T=phase.t;
  const cx=W/2,cy=H*.44;
  if(T<4.2){ // bubble space
    const e=Math.min(1,T/1.4),col=T>3.2?Math.min(1,(T-3.2)/1):0;
    for(const b of foamS){const ex=b.tx0+Math.sin(t*.8+b.ph)*8,ey=b.ty0+Math.cos(t*.7+b.ph)*6;
      b.x=phase.ox+(ex-phase.ox)*e;b.y=phase.oy+(ey-phase.oy)*e;
      const x=b.x+(cx-b.x)*col,y=b.y+(cy-b.y)*col,r=b.r*(1-col*.9);
      ctx.save();ctx.globalAlpha=1-col*.6;ctx.fillStyle=AX[b.ax]+'22';ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.restore();
      bubble(x,y,r,t,1-col*.5,b.ph*50);
      if(col<.4){ctx.fillStyle=AX[b.ax];ctx.font='11px system-ui,sans-serif';ctx.textAlign='center';wrap(b.tx,x,y-4,r*1.9,13,1-col*2.5);ctx.textAlign='left';
        ctx.fillStyle='rgba(255,255,255,.45)';ctx.font='9px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(b.ax,x,y+r-8);ctx.textAlign='left';}}
    if(T<1.6){ctx.fillStyle='rgba(230,225,255,.7)';ctx.font='12px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('bubble space · every sentence it could have been',W/2,H-118);ctx.textAlign='left';}
  } else if(T<4.9){ // stick
    const u=(T-4.2)/.7;ctx.strokeStyle=`rgba(255,255,255,${1-u*.3})`;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,cy-120*Math.sin(u*Math.PI));ctx.lineTo(cx,cy+120*Math.sin(u*Math.PI));ctx.stroke();
    ctx.fillStyle='rgba(230,225,255,.7)';ctx.font='12px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('stick',cx+22,cy);ctx.textAlign='left';
  } else if(T<8){ // glyph
    const u=Math.min(1,(T-4.9)/.6),out=T>7.2?(T-7.2)/.8:0;
    ctx.save();ctx.globalAlpha=u*(1-out);ctx.textAlign='center';ctx.font=`500 ${Math.min(40,Math.max(20,W/(phase.glyph.length*.7)))}px Georgia,serif`;
    const gr=ctx.createLinearGradient(cx-300,0,cx+300,0);for(let i=0;i<=6;i++)gr.addColorStop(i/6,`hsl(${(t*40+i*55)%360},85%,78%)`);ctx.fillStyle=gr;
    wrap(phase.glyph,cx,cy,Math.min(W*.8,760),46,1);ctx.restore();
    if(T>5.6&&!phase.fogged){phase.fogged=1;addFog(cx,cy);}
  } else if(T<14){ // echo
    const u=(T-8)/6;const x=cx+Math.sin(u*3)*40,y=cy-u*H*.12,r=70+u*30;
    ctx.save();ctx.globalAlpha=u<.12?u/.12:1-Math.max(0,(u-.8)/.2);
    bubble(x,y,r,t,1,200);ctx.fillStyle='#efe9ff';ctx.font='13px system-ui,sans-serif';ctx.textAlign='center';wrap(phase.reply,x,y-10,r*1.75,16,1);
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='10px system-ui,sans-serif';ctx.fillText('echo',x,y+r-12);ctx.restore();
    if(phase.dest&&!phase.went&&T>9.5){phase.went=1;go(phase.dest,cx,cy);}
  } else phase=null;
}
function wrap(s,x,y,maxW,lh,a){ctx.save();ctx.globalAlpha*=clamp(a,0,1);const ws=s.split(' ');const lines=[];let L='';for(const w of ws){const tt=L?L+' '+w:w;if(ctx.measureText(tt).width>maxW&&L){lines.push(L);L=w;}else L=tt;}lines.push(L);
  const y0=y-(lines.length-1)*lh/2;lines.slice(0,6).forEach((l,i)=>ctx.fillText(l,x,y0+i*lh));ctx.restore();}
function threads(){const kc=store.get('keys',{});const top=Object.entries(kc).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const el=document.getElementById('threads');const grown=Object.keys(kc).length;el.innerHTML=top.length?`the froth has grown ${grown} bubble${grown>1?'s':''} from your words · threads you return to: `+top.map(([k])=>`<i data-k="${k}">${k}</i>`).join(' · '):'your words stay on this device; the toy learns which threads you return to';
  el.querySelectorAll('i').forEach(i=>i.onclick=()=>{document.getElementById('q').value=i.dataset.k;document.getElementById('q').focus();});}
const qi=document.getElementById('q'),err=document.getElementById('err');
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const s=qi.value.trim();if(!s){err.textContent='breathe a word first';return;}if(phase&&phase.t<8){err.textContent='still echoing · one breath at a time';return;}err.textContent='';hideCard();bloom(s);qi.value='';});
qi.addEventListener('input',()=>{err.textContent='';});

/* ---------- input ---------- */
const hint=document.getElementById('hint');
cv.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;lastMove=performance.now()/1000;if(trans)return;const s=BY[cur].hover(e.clientX,e.clientY);hint.textContent=s;hint.style.opacity=s?1:0;cv.style.cursor=/click to (travel|go)/.test(s)||/news/.test(s)?'pointer':'default';});
cv.addEventListener('click',e=>{if(trans)return;BY[cur].click(e.clientX,e.clientY);});
cv.addEventListener('wheel',e=>{if(e.deltaY>40&&!trans){const i=ORDER.indexOf(cur);if(i>0)go(ORDER[i-1]);}},{passive:true});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(card.style.display==='block')hideCard();else{const i=ORDER.indexOf(cur);if(i>0)go(ORDER[i-1]);}}});
document.getElementById('figbtn').onclick=e=>{FIG=!FIG;e.target.textContent=FIG?'on':'off';toast(FIG?'figurative wing on: elusiphores shimmer in pink and green':'figurative wing off: only what has been measured');};
document.querySelectorAll('#speed [data-s]').forEach(b=>b.onclick=()=>{if(b.dataset.s==='today'){simDays=TODAY;speed=0;}else speed=+b.dataset.s;});
addEventListener('resize',resize);

/* ---------- loop ---------- */
let last=performance.now(),t0=last;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=(now-t0)/1000;
  ctx.fillStyle='#07050d';ctx.fillRect(0,0,W,H);
  if(trans){trans.t+=dt/1.3;const u=clamp(trans.t,0,1),e=u*u*(3-2*u);const A=BY[trans.from],B=BY[trans.to],d=trans.dir;
    ctx.save();ctx.globalAlpha=1-e;ctx.translate(trans.x,trans.y);const sa=d>0?1+e*7:1-e*.8;ctx.scale(sa,sa);ctx.translate(-trans.x,-trans.y);A.draw(t,0);ctx.restore();
    ctx.save();ctx.globalAlpha=e;ctx.translate(W/2,H/2);const sb=d>0?.25+.75*e:1+(1-e)*4;ctx.scale(sb,sb);ctx.translate(-W/2,-H/2);B.draw(t,dt);ctx.restore();
    if(u>=1)trans=null;}
  else BY[cur].draw(t,dt);
  if(LENS&&!trans)drawLens(t);
  drawFog();fog=Math.max(0,fog-dt*.55);
  drawSentence(dt,t);
  requestAnimationFrame(frame);}
resize();Dand.layout();crumbs();threads();visit('meta');
document.querySelectorAll('[data-form]').forEach(b=>b.onclick=()=>{FORM=b.dataset.form;document.querySelectorAll('[data-form]').forEach(x=>x.classList.toggle('on',x===b));if(cur!=='meta')go('meta');toast(FORM==='dandelion'?'dandelion clock: explore, collapse to one, expand again':'foam cosmos: the physical froth in the corner of everything');});
document.getElementById('lensbtn').onclick=e=>{LENS=!LENS;e.target.classList.toggle('on',LENS);if(LENS)showInfo('lens');};
requestAnimationFrame(frame);
window.__macro={setForm:f=>document.querySelector(`[data-form=${f}]`).click(),lens:()=>document.getElementById('lensbtn').click(),blow:()=>Dand.blow(),go,bloom,showPlanet:id=>showPlanet(PLANETS.find(p=>p.id===id)),ticket,get cur(){return cur}};
})();
</script>

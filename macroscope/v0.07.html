'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);scenes.forEach(s=>s.layout&&s.layout());if(typeof Dand!=='undefined')Dand.layout();if(typeof Diag!=='undefined')Diag.layout();}
const TAU=Math.PI*2, rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let seed=7;function srnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
function gauss(){return Math.sqrt(-2*Math.log(srnd()+1e-9))*Math.cos(TAU*srnd());}

const GATHERED='2026-11-19';
const ATLAS={"nodes":[{"id":"ka","label":"Knowledge Amp","kind":"root","gist":"D's original design (taught by toyMaker, 2002 onward) for a new human intelligence, training, education and play network that concentrates assets across all users; a model of what toyMaker, and all of nature, use. Written up 2010-2025 as Knowledge Amp, Adaptive Heuristics and Intelligence Amp.","quote":"","src":"","status":"core"},{"id":"p-relation","label":"Intelligence is relation","kind":"principle","gist":"Intelligence is not owned by a person; it is evoked between people, in context, and only instanced locally.","quote":"This is the real birthplace of the stuff we speak about with the word intelligence: it is relation. Specifically. Always.","src":"KA2.scriv/Files/Docs/3.rtf","status":"unbuilt"},{"id":"p-pods","label":"Small, tightly-knit groups","kind":"principle","gist":"We are born, learn, prosper and are fulfilled in small groups where progress is visible and informs every member.","quote":"","src":"KA2.scriv/Files/Docs/3.rtf","status":"unbuilt"},{"id":"p-invitation","label":"Invitation, not declaration","kind":"principle","gist":"Authority demands declaration (control, profit); intelligence grows by invitation. The internet began as invitation and turned to declaration.","quote":"Intelligence » Invitation » Emergence : The Internet.","src":"KA2.scriv/Files/Docs/3.rtf","status":"unbuilt"},{"id":"p-childhood","label":"The internet is a childhood","kind":"principle","gist":"The network is an accelerated developmental domain, like a child gaining language: every loss becomes ten thousand, and so does every gain.","quote":"Internet = childhood.","src":"KA2.scriv/Files/Docs/9.rtf","status":"unbuilt"},{"id":"p-attention","label":"Attention is the money of learning","kind":"principle","gist":"Human attention is a developmental superfuel; children chase it because it amplifies memory and connection.","quote":"","src":"KA2.scriv/Files/Docs/3.rtf","status":"unbuilt"},{"id":"p-connotation","label":"Connotation is the key","kind":"principle","gist":"Minds are associative and connotative; today's tools are denotative indexes. Restore metaphor, ambiguity and association to every search.","quote":"Connotation is the key to prodigy and intelligence.","src":"IA.docx","status":"partial"},{"id":"p-likeminds","label":"Tools shaped like minds","kind":"principle","gist":"Minds take the shape of the tools they use, so put the burden of likeness on the technology, not the mind.","quote":"I want technologies that work more like our minds","src":"IA.docx","status":"unbuilt"},{"id":"p-mindright","label":"Users own what they make","kind":"principle","gist":"Users are the only real technology behind the internet; they should own the benefits of their activity, not be farmed for it.","quote":"","src":"Old/Quotes KA.scriv/Files/Data/E73F20CB-F180-4773-97DA-A176B0F8DA40/content.rtf","status":"seed"},{"id":"p-octopus","label":"Competition backwards","kind":"principle","gist":"Compete to raise everyone else's possible excellence first, and so your own. Promotion by mutual merit only.","quote":"octopuses are intelligent because all of them compete not merely to excel but to increase the possible excellence of all others first","src":"KA2.scriv/Files/Docs/3.rtf","status":"unbuilt"},{"id":"p-verity","label":"Verity over popularity","kind":"principle","gist":"Rank by truth, value and reliability, not by popularity or copying.","quote":"","src":"KA 1.docx","status":"partial"},{"id":"p-burning","label":"Burning forward","kind":"principle","gist":"Learning-forward: drop the shells that only bring popularity; keep what nourishes. Make only what is excellent.","quote":"We make only what is excellent, and things that arent? Die.","src":"Old/P T O KA.scriv/Files/Docs/3.rtf","status":"partial"},{"id":"p-nomasters","label":"No mimics, no masters","kind":"principle","gist":"The primary paradigm is mutual education. Reward mutuality and accomplishment, not individuality and appearance.","quote":"","src":"Old/P T O KA.scriv/Files/Docs/3.rtf","status":"unbuilt"},{"id":"p-ambiguity","label":"Return ambiguity","kind":"principle","gist":"Bring intelligent ambiguity back into learning and browsing: many vectors of extension, metaphor and meaning. Like Hebrew, use what is missing to enrich what is there.","quote":"","src":"KA2.scriv/Files/Docs/9.rtf","status":"unbuilt"},{"id":"p-laughter","label":"Laughter as agreement","kind":"principle","gist":"Laughter is a wave of shared, pleasant agreement; what is its equivalent for social intelligence? Swarms of people raining together over methods and purposes.","quote":"","src":"KA2.scriv/Files/Docs/3.rtf","status":"unbuilt"},{"id":"p-roles","label":"Give roles, not jobs","kind":"principle","gist":"Nature and humans give you better algorithms if you give them roles. We have been given jobs instead of roles since language, print and money.","quote":"","src":"KA2.scriv/Files/Docs/9.rtf","status":"seed"},{"id":"o-server","label":"Server / One-Way Barrier","kind":"organ","gist":"An anonymising wall between users and the internet: shows the internet a \"no one\" face, composes each person's artifact, runs search, sentinel and social hub.","quote":"","src":"IA.docx","status":"unbuilt"},{"id":"o-interface","label":"Interface (Intelligent Input Exploration Platform)","kind":"organ","gist":"Replaces the browser. Floats like two open hands: image rays on the left, text rays on the right, input and reception window between, synthesis controls below.","quote":"","src":"IA.docx","status":"partial"},{"id":"o-ce","label":"Connotation Engine","kind":"organ","gist":"Shows results inside a field of associated topics, images and media built from your artifact, with a dial from literal to associative.","quote":"","src":"IA.docx","status":"partial"},{"id":"o-constellator","label":"Constellator","kind":"organ","gist":"Three wheels (imaging metaphor cloud, linguistic metaphor cloud, conceptual cloud) whose front five items link into a constellation under the input bar; spin a wheel and the constellation changes.","quote":"","src":"KA 1.docx","status":"partial"},{"id":"o-etym","label":"Linguistic Analysis / Etymology AI","kind":"organ","gist":"A window above the input that shows the etymology, synonyms, metaphors and analogies of whatever you type, so every search deepens your language.","quote":"","src":"IA.docx","status":"partial"},{"id":"o-iar","label":"Intelligence Artifact","kind":"organ","gist":"A locally stored, encrypted, ever-growing record of one person's (or group's) electronic life and analytics: their \"secondary mind\". Layered from fully public to fully private; can be linked, blended, sold by layer, and used as identity.","quote":"","src":"IA.docx","status":"built"},{"id":"o-sentinel","label":"Vetting Sentinel","kind":"organ","gist":"A forensic toolbox trained by people that overlays any media with its pedigree, verity, rhetoric, purpose and beneficiaries; makes lying and copying expensive.","quote":"","src":"IA.docx","status":"partial"},{"id":"o-passforge","label":"Passforge (Identity Agent)","kind":"organ","gist":"Identity proven by your own unfakeable activity, stored in your artifact; recognises its author only and can replace passwords.","quote":"","src":"RK.docx","status":"seed"},{"id":"o-sna","label":"Social Networking Agent","kind":"organ","gist":"Forum, adventure system, identity map and learning environment in one, connected to each person's artifact.","quote":"","src":"IA.docx","status":"seed"},{"id":"o-adventure","label":"Social Adventuring System","kind":"organ","gist":"Avatars form teams, take on meaningful roles and compete to solve real-world problems, with badges, levels and classes earned by merit.","quote":"","src":"IA.docx","status":"seed"},{"id":"o-dividends","label":"Data democracy investment system","kind":"organ","gist":"User-owned search and social systems that pay users dividends in cash and intelligence every time they are used.","quote":"","src":"RK.docx","status":"seed"},{"id":"o-pods","label":"Pods, scouts, predators, mimics","kind":"organ","gist":"Linked rings of small groups bound by purpose; scouts or orbitals bring in outside news and gain powers; predators may be neutral, aggressive or mimetic; elders and kids are types.","quote":"","src":"Old/P T O KA.scriv/Files/Docs/3.rtf","status":"seed"},{"id":"f-travel","label":"Travelling into constellations","kind":"flow","gist":"Search fills the front of each ray; pick a few results and press proceed, and they become the next input, so you travel level by level instead of reading a list.","quote":"","src":"IA.docx","status":"partial"},{"id":"f-newscast","label":"The newscast vetting","kind":"flow","gist":"Watch a newscast; the Sentinel transcribes it and builds forensic overlays; you score earlier evaluations, add your own and are credited when it is outed as propaganda. A Sherlock Holmes adventure from one video.","quote":"","src":"KA 1.docx","status":"partial"},{"id":"f-searchas","label":"Searching as someone else","kind":"flow","gist":"Search as yourself, as a friend, as a blend of people, or as a composite of the dead (Einstein, Socrates) built from their records.","quote":"","src":"IA.docx","status":"built"},{"id":"f-swarm","label":"Swarms re-resolving in waves","kind":"flow","gist":"Learning comes in wave-like reintroductions of the same ideas from shifting perspectives: multiple passes, re-recognising.","quote":"","src":"KA2.scriv/Files/Docs/3.rtf","status":"partial"},{"id":"f-trance","label":"Trance","kind":"flow","gist":"A pulsed, wave-like group dance of focused attention that celebrates every member, rewards diversity and keeps honesty without rules; collapsing it onto one person breaks it.","quote":"","src":"Old/Knowledge Amp.scriv/Files/Data/3F69961E-C28A-4515-9164-313669364763/content.rtf","status":"built"},{"id":"f-periphery","label":"The peripheral forest","kind":"flow","gist":"At D's desk, videos sit to the left and books to the right, like a forest walk to the screen, until the flat rectangle strips it away. KA restores that periphery.","quote":"","src":"KA2.scriv/Files/Docs/9.rtf","status":"partial"},{"id":"w-between","label":"Intelligence is Between Us","kind":"word","gist":"Title node of the ASL map: intelligence is the mutual pursuit of trusted insight, recognition and advancement.","quote":"","src":"ASL.scap","status":"unbuilt"},{"id":"w-dreamdata","label":"dream in dataspace","kind":"word","gist":"Explore by constellation and metaphor instead of index and list.","quote":"","src":"RK.docx","status":"built"},{"id":"w-mindright","label":"mindright","kind":"word","gist":"Not copyright: ownership of the intelligence your activity makes.","quote":"","src":"Old/Quotes KA.scriv/Files/Data/E73F20CB-F180-4773-97DA-A176B0F8DA40/content.rtf","status":"seed"},{"id":"w-metaphy","label":"metaphy / metaphication","kind":"word","gist":"Turning data relationships into metaphor: dimensions of knowledge, flow instead of stasis.","quote":"","src":"Old/P T O KA.scriv/Files/Docs/3.rtf","status":"built"},{"id":"w-rhetological","label":"rhetological","kind":"word","gist":"Rhetoric plus logic: analysis of how speech persuades; a planned markup language.","quote":"","src":"Old/P T O KA.scriv/Files/Docs/3.rtf","status":"partial"},{"id":"w-hach","label":"HACH","kind":"word","gist":"Human-Assisted Computational Heuristics: D's name for what is usually called AI or machine learning, with people training it.","quote":"","src":"IA.docx","status":"seed"},{"id":"w-datagiants","label":"dataGiants, infoMonsters, infoserfs","kind":"word","gist":"The giants who farm data and the users who build their pyramids.","quote":"","src":"KA2.scriv/Files/Docs/9.rtf","status":"unbuilt"},{"id":"w-add","label":"accelerated developmental domain","kind":"word","gist":"The internet seen as a sped-up childhood.","quote":"","src":"KA2.scriv/Files/Docs/3.rtf","status":"unbuilt"},{"id":"w-liquid","label":"liquid government","kind":"word","gist":"A context-sensitive superposition of governing intelligences that is trustworthy by the nature of its organs.","quote":"","src":"KA2.scriv/Files/Docs/3.rtf","status":"unbuilt"},{"id":"w-avatars","label":"learning-avatars","kind":"word","gist":"Avatars of intelligence and sensing, not persona; they compete as informational superheroes and fight in digital space instead of physical.","quote":"","src":"KA2.scriv/Files/Docs/4.rtf","status":"seed"},{"id":"w-parauser","label":"para-users","kind":"word","gist":"Theoretical users composited from shared layers of several artifacts.","quote":"","src":"IA.docx","status":"unbuilt"},{"id":"w-ipr","label":"IPR","kind":"word","gist":"Intimate, purposive, relational: what intelligence is, and what computation is not.","quote":"Intelligence is intimate, purposive, and relational. IPR.","src":"There is too much to tell. A.textClipping","status":"unbuilt"},{"id":"w-supergroups","label":"superGroups","kind":"word","gist":"Group intelligence flows down to individuals, who improve it with every move, inside constellated superGroups.","quote":"","src":"Int Amp Cuts/They do the opposite of what.textClipping","status":"seed"},{"id":"f-ecogame","label":"The nature-cost lens","kind":"flow","gist":"An augmented-reality game, like seeing Pokemon through a phone, that shows the cost or benefit to nature and community of any product or business; you win by preserving them through your choices.","quote":"","src":"Just as people are able to p.textClipping","status":"built"},{"id":"f-photo","label":"The burning-building photo","kind":"flow","gist":"Searching for a fire photo, the Sentinel shows where and by whom it was taken and that copies were doctored; you are credited, the fakes and their sites are devalued, and the internet gets smarter.","quote":"","src":"You are looking for an image.textClipping","status":"partial"},{"id":"p-surveillance","label":"Surveillance as an asset","kind":"principle","gist":"Minds are born in loving surveillance: parents, peers and imaginary friends watching, and we imagine what they'd think. KA turns surveillance from a tool for selling and prosecuting into one that builds our own intelligence.","quote":"surveillance is an asset that we can use to build new forms of intelligence","src":"Sketching The Knowledge Amp_ A Mutual Intelligence Synthesis Engine.mp4","status":"built"},{"id":"p-dreaming","label":"Memory is not storage","kind":"principle","gist":"Minds work like dreaming or forests, not dictionaries; if we do not dream we cannot learn, and we die. Search that retrains us to think in flat lists damages intelligence.","quote":"Memory is not storage, it is like constellations of living gardens.","src":"There is too much to tell. A.textClipping","status":"partial"},{"id":"w-superfunction","label":"mutual superfunction","kind":"word","gist":"What a tightly knit team (like a sports team) reaches when its members watch each other closely: perception and action beyond normal function. KA aims that at real problems, not scoreboards.","quote":"","src":"Sketching The Knowledge Amp_ A Mutual Intelligence Synthesis Engine.mp4","status":"unbuilt"},{"id":"w-synth","label":"intelligence synthesizer","kind":"word","gist":"D's 2013 summary of what KA is for: making the music of human intelligence together, mostly just by talking, watching and reading.","quote":"","src":"Sketching The Knowledge Amp_ A Mutual Intelligence Synthesis Engine.mp4","status":"built"},{"id":"n-jinglia","label":"Jinglia","kind":"now","gist":"A metasynth web experience: Wraywrai, wardrobe, songome, linguisynth, plidge recordings. D calls it a toy of KA.","quote":"","src":"","status":"built"},{"id":"n-ww","label":"Wraywrai","kind":"now","gist":"Jinglia's origin character: synths words (wyrdulation), wardrobe looks, illoscopia lips.","quote":"","src":"","status":"built"},{"id":"n-display","label":"KA Display Center 0.02","kind":"now","gist":"Petals of images left, facts right, bridges middle, etymology above the input, the first shell /* ---------- foam bubble drawing (thin-film shimmer) ---------- */
function bubble(x,y,r,t,a=1,hueOff=0){
  if(r<0.5)return;
  ctx.save();ctx.globalAlpha=a;
  const g=ctx.createRadialGradient(x-r*.3,y-r*.35,r*.1,x,y,r);
  g.addColorStop(0,'rgba(255,255,255,0.05)');g.addColorStop(.75,'rgba(150,130,255,0.04)');g.addColorStop(1,'rgba(200,180,255,0.16)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  const n=r>60?7:3;
  for(let i=0;i<n;i++){
    const h=(hueOff+t*18+i*47+(x+y)*.2)%360;
    ctx.strokeStyle=`hsla(${h},90%,72%,${(r>60?.22:.5)/(1+i*.6)})`;
    ctx.lineWidth=Math.max(.6,r*(r>60?.012:.05));
    ctx.beginPath();ctx.arc(x,y,r*(1-i*(r>60?.006:.05)),0,TAU);ctx.stroke();
  }
  const ha=r>60?.06:r>20?.16:.5;ctx.fillStyle=`rgba(255,255,255,${ha})`;ctx.beginPath();
  ctx.ellipse(x-r*.5,y-r*.55,r*(r>20?.11:.18),r*(r>20?.045:.08),-.7,0,TAU);ctx.fill();
  ctx.restore();
}
function addFog(x,y){fog=1;fogX=x;fogY=y;}
function drawFog(){
  if(fog<=0.01)return;
  const R=Math.hypot(W,H)*(1.15-fog);
  const g=ctx.createRadialGradient(fogX,fogY,0,fogX,fogY,R);

  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

const STOP=new Set('a an the and or but if of to in on at by for with from as is are was were be been am i you we they he she it this that these those my your our their me us them do does did not no so too very just what who where when why how can will would should could there here about into over under than then also'.split(' '));
const HOLO='place thing method being light hand face flower person sun tree mother world space foot sky father mind moon eye animal dream food time love play star song word friend separation number idea reflection category birth life point line circle soul organism plant bird fish'.split(' ');
const VERBS='touch hear know feel hold see learn find'.split(' ');
const an=w=>(/^[aeiou]/.test(w)?'an ':'a ')+w;
const POINTERS={mercury:'solar',venus:'solar',earth:'solar',moon:'solar',mars:'solar',jupiter:'solar',saturn:'solar',uranus:'solar',neptune:'solar',sun:'solar',planet:'solar',planets:'solar',galaxy:'galaxy',milky:'galaxy',stars:'galaxy',star:'galaxy',web:'web',cosmos:'web',universe:'web',galaxies:'web',everything:'meta',creation:'meta',bubble:'meta',one:'meta'};

const AX={past:'#f2b45a',future:'#8fa8ff',threat:'#ff8a7a',benefit:'#79e0c4',mirror:'#e59ad0'};

function words(s){return (s.toLowerCase().match(/[a-z’']+/g)||[]).map(w=>w.replace(/[’']/g,''));}

function variants(s,k){const h=pick(HOLO),h2=pick(HOLO.filter(x=>x!==h)),v=pick(VERBS);const ws=s.trim().split(/\s+/);
  return [
   ['past',`long before this, ${k} was already ${h}`],
   ['future',`soon, ${k} will ${v} the ${h2}`],
   ['threat',`unless ${k} is held gently, it breaks`],
   ['benefit',`because of ${k}, someone is fed`],
   ['mirror',ws.slice().reverse().join(' ')],
   ['future',`what is ${k} looking at, when it looks at you?`],
   ['benefit',`every ${k} is ${an(h)}; every ${h} is a mirror; so every ${k} is a mirror`],
   ['past',`${k} : ${h} | you : ?`],
   ['threat',`what if ${k} were never said?`]
  ];}
function reply(s,k){
  const hist=store.get('hist',[]);const ws=new Set(words(s).filter(w=>!STOP.has(w)&&w.length>2));

  hist.push(s);store.set('hist',hist.slice(-60));
  const kc=store.get('keys',{});kc[k]=(kc[k]||0)+1;store.set('keys',kc);
  if(link)return `earlier: “${link.old.slice(0,48)}”. both touch “${link.w}”. so they meet there, and so do you`;
  const h=pick(HOLO);

    const gr=ctx.createLinearGradient(cx-300,0,cx+300,0);for(let i=0;i<=6;i++)gr.addColorStop(i/6,`hsl(${(t*40+i*55)%360},85%,78%)`);ctx.fillStyle=gr;

    if(phase.dest&&!phase.went&&T>9.5){phase.went=1;go(phase.dest,cx,cy);}

/* ---------- loop ---------- */
let last=performance.now(),t0=last;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=(now-t0)/1000;
  ctx.fillStyle='#07050d';ctx.fillRect(0,0,W,H);
  if(trans){trans.t+=dt/1.3;const u=clamp(trans.t,0,1),e=u*u*(3-2*u);const A=BY[trans.from],B=BY[trans.to],d=trans.dir;
    ctx.save();ctx.globalAlpha=1-e;ctx.translate(trans.x,trans.y);const sa=d>0?1+e*7:1-e*.8;ctx.scale(sa,sa);ctx.translate(-trans.x,-trans.y);A.draw(t,0);ctx.restore();
    ctx.save();ctx.globalAlpha=e;ctx.translate(W/2,H/2);const sb=d>0?.25+.75*e:1+(1-e)*4;ctx.scale(sb,sb);ctx.translate(-W/2,-H/2);B.draw(t,dt);ctx.restore();
    if(u>=1)trans=null;}
  else BY[cur].draw(t,dt);
  if(LENS&&!trans)drawLens(t);
  drawFog();fog=Math.max(0,fog-dt*.55);
  drawSentence(dt,t);
  requestAnimationFrame(frame);}
resize();Dand.layout();Diag.layout();crumbs();threads();visit('meta');
document.querySelectorAll('[data-form]').forEach(b=>b.onclick=()=>{FORM=b.dataset.form;document.querySelectorAll('[data-form]').forEach(x=>x.classList.toggle('on',x===b));if(cur!=='meta')go('meta');toast(FORM==='diagramatica'?'diagramatica: families as bubbles, methods as froth':FORM==='dandelion'?'dandelion clock: explore, collapse to one, expand again':'foam cosmos: the physical froth in the corner of everything');});
document.getElementById('lensbtn').onclick=e=>{LENS=!LENS;e.target.classList.toggle('on',LENS);if(LENS)showInfo('lens');};
/* ---------- voice + breath (illoscopia kin) ---------- */
let VOICE=store.get('voice',true);const vb=document.getElementById('voicebtn');vb.textContent=VOICE?'voice on':'voice off';vb.classList.toggle('on',VOICE);
vb.onclick=()=>{VOICE=!VOICE;store.set('voice',VOICE);vb.textContent=VOICE?'voice on':'voice off';vb.classList.toggle('on',VOICE);if(!VOICE&&window.speechSynthesis)speechSynthesis.cancel();toast(VOICE?'Wraywrai’s voice reads each echo, gently (a soft stand-in voice from this device)':'quiet: the echo is only seen');};
function speak(txt){try{if(!VOICE||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt.replace(/[“”]/g,''));const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/Samantha|Serena|Moira|Karen|Google UK English Female|Female/i.test(v.name))||vs.find(v=>/^en/i.test(v.lang))||null;u.rate=.86;u.pitch=1.05;u.volume=.8;speechSynthesis.speak(u);}catch(e){}}
let MIC=null;const mb=document.getElementById('micbtn');
function micOff(){if(MIC){MIC.stream.getTracks().forEach(t=>t.stop());try{MIC.ac.close()}catch(e){}cancelAnimationFrame(MIC.raf);MIC=null;}mb.textContent='breathe in (mic)';mb.classList.remove('on');}
async function micOn(){try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const ac=new (window.AudioContext||window.webkitAudioContext)();const an=ac.createAnalyser();an.fftSize=512;ac.createMediaStreamSource(stream).connect(an);const buf=new Float32Array(an.fftSize);MIC={stream,ac,an,buf,hold:0,raf:0};
  stream.getTracks().forEach(t=>t.onended=micOff);mb.textContent='mic on · blow';mb.classList.add('on');if(FORM!=='dandelion')document.querySelector('[data-form=dandelion]').click();toast('blow softly at your mic: the breath carries the seeds');
  const loop=()=>{if(!MIC)return;an.getFloatTimeDomainData(buf);let e=0;for(const v of buf)e+=v*v;const rms=Math.sqrt(e/buf.length);MIC.hold=rms>.08?MIC.hold+1:Math.max(0,MIC.hold-2);if(MIC.hold>8&&cur==='meta'&&FORM==='dandelion'&&Dand.st==='rest'){MIC.hold=0;Dand.blow(W*.2,H);addFog(Dand.cx,Dand.cy);}MIC.raf=requestAnimationFrame(loop);};loop();}
  catch(e){micOff();toast('no mic this time · a click on the clock blows it too');}}
mb.onclick=()=>MIC?micOff():micOn();addEventListener('pagehide',micOff);
requestAnimationFrame(frame);
window.__macro={speak,diagHover:(fi,mi)=>{const f=Diag.F[fi];const p=mi==null?f:f.pts[mi];Meta.hover(p.x,p.y)},family:i=>showFamily(Diag.F[i]),shell:id=>{showPlanet(id==='sun'?SUN:PLANETS.find(p=>p.id===id));openShell(id,document.getElementById('shellbox'))},showNode:id=>showNode(ATLAS.nodes.find(n=>n.id===id)),hoverNode:i=>{const b=Meta.foam.filter(b=>b.n)[i];Meta.hover(b.x,b.y);return [b.x,b.y]},setForm:f=>document.querySelector(`[data-form=${f}]`).click(),lens:()=>document.getElementById('lensbtn').click(),blow:()=>Dand.blow(),go,bloom,showPlanet:id=>showPlanet(PLANETS.find(p=>p.id===id)),ticket,get cur(){return cur}};
})();
